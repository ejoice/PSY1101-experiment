<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Swahili Word Matching · Fresh Pair</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #d4edda;
            background: linear-gradient(145deg, #e0f2e9 0%, #c8e6d9 100%);
            padding: 8px;
        }

        /* Start screen card */
        .start-screen {
            background: #ffffffdd;
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 36px 24px;
            box-shadow: 0 25px 40px -12px rgba(40, 70, 50, 0.3);
            text-align: center;
            max-width: 420px;
            width: 100%;
            border: 1px solid #b8d9c4;
        }

        .start-screen p {
            color: #4a6e57;
            margin-bottom: 24px;
            font-size: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .input-group input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid #b8d9c4;
            border-radius: 40px;
            font-size: 1rem;
            background: #f8fff9;
            outline: none;
            transition: all 0.2s;
            color: #1e3b2b;
            font-weight: 500;
        }

        .input-group input:focus {
            border-color: #4f9e6a;
            box-shadow: 0 0 0 4px rgba(79, 158, 106, 0.2);
            background: white;
        }

        .input-group input::placeholder {
            color: #98b9a6;
            font-weight: 400;
        }

        .start-btn {
            background: #2f6b47;
            border: none;
            border-radius: 40px;
            padding: 14px 36px;
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 10px 15px -5px #1e3b2b80;
            letter-spacing: 0.5px;
            width: 100%;
        }

        .start-btn:hover:not(:disabled) {
            background: #1e4f33;
            transform: scale(1.02);
            box-shadow: 0 15px 20px -8px #1e3b2b;
        }

        .start-btn:disabled {
            background: #b8cfc1;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Main game screen */
        .game-screen {
            display: none;
            width: 100%;
            max-width: 1200px;
            background: #ffffffdd;
            backdrop-filter: blur(6px);
            border-radius: 32px;
            padding: 16px 12px 20px;
            box-shadow: 0 30px 40px -15px #2d4a37;
            border: 1px solid #cfe6d9;
        }

        /* Top info bar */
        .game-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 4px;
            gap: 8px;
        }

        .student-badge {
            background: #f0faf3;
            border-radius: 40px;
            padding: 8px 16px;
            font-weight: 600;
            color: #1e4f33;
            border: 1px solid #b1d5be;
            font-size: 0.85rem;
            box-shadow: 0 2px 6px #d0e6d9;
            white-space: nowrap;
        }

        .score-badge {
            background: #1e4f33;
            color: white;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 12px -6px #1e3b2b;
            white-space: nowrap;
        }

        .score-badge span {
            font-weight: 700;
            margin-left: 6px;
            background: #ffffff30;
            padding: 2px 10px;
            border-radius: 30px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .action-buttons button {
            border: none;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 6px 10px -5px #1e3b2b80;
            border: 1px solid #c2d9cb;
            white-space: nowrap;
        }

        .restart-btn {
            background: #e8f3ec;
            color: #2a5c3e;
        }

        .restart-btn:hover {
            background: #d2e7db;
        }

        .submit-btn {
            background: #2f6b47;
            color: white;
            border: 1px solid #1e4f33;
        }

        .submit-btn:hover {
            background: #1e4f33;
        }

        /* Left/Right columns */
        .columns-container {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .column {
            flex: 1;
            border-radius: 28px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            min-height: 420px;
            box-shadow: inset 0 2px 10px #00000008, 0 8px 18px -8px #3a5f4b30;
        }

        .left-column {
            background: #fff9e6;
            border: 2px solid #f3e5b0;
        }

        .right-column {
            background: #e9f7e9;
            border: 2px solid #b8dfb8;
        }

        .word-grid {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 8px;
        }

        .word-item {
            background: #ffffffdd;
            border-radius: 20px;
            padding: 8px 6px;
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: all 0.15s;
            border: 2px solid #e0ecd9;
            color: #1f3d2e;
            box-shadow: 0 3px 6px -3px #7a9b87;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            word-break: break-word;
            line-height: 1.2;
        }

        .left-column .word-item {
            border-color: #e6d9a8;
            background: #fffff2;
        }

        .right-column .word-item {
            border-color: #b8d9b8;
            background: #fbfffb;
        }

        .word-item.selected {
            border: 3px solid #2f6b47;
            box-shadow: 0 0 0 3px #a9d9b9;
            transform: scale(1.02);
            background: #f2fff6;
        }

        .word-item.matched-pair {
            border-width: 2px;
        }

        .word-item.correct-submit {
            background: #b1e6b1 !important;
            border-color: #2f6b47 !important;
            color: #1a3a26;
        }

        .word-item.wrong-submit {
            background: #f8b5b5 !important;
            border-color: #b33c3c !important;
            color: #621f1f;
        }

        .hint {
            font-size: 0.75rem;
            color: #567a64;
            margin-top: 8px;
            text-align: center;
            width: 100%;
            padding: 0 4px;
        }

        /* Small screen optimization: keep left-right layout */
        @media (max-width: 480px) {
            body {
                padding: 4px;
            }
            .game-screen {
                padding: 10px 6px 14px;
                border-radius: 24px;
            }
            .word-item {
                font-size: 0.85rem;
                padding: 6px 4px;
                min-height: 42px;
                border-radius: 16px;
            }
            .column {
                padding: 8px 5px;
                border-radius: 22px;
                min-height: 360px;
                gap: 6px;
            }
            .student-badge {
                font-size: 0.75rem;
                padding: 6px 12px;
            }
            .score-badge {
                font-size: 0.85rem;
                padding: 6px 14px;
            }
            .action-buttons button {
                font-size: 0.75rem;
                padding: 6px 14px;
            }
            .hint {
                font-size: 0.7rem;
            }
        }

        @media (max-width: 360px) {
            .word-item {
                font-size: 0.75rem;
                min-height: 38px;
                padding: 4px 3px;
            }
            .column {
                padding: 6px 4px;
                min-height: 320px;
            }
        }
    </style>
</head>
<body>

    <!-- Start screen -->
    <div class="start-screen" id="startScreen">
        <p>Enter your Student ID to start pairing</p>
        <div class="input-group">
            <input type="text" id="studentIdInput" placeholder="e.g. s1234567" autocomplete="off">
            <button class="start-btn" id="startBtn" disabled>Start</button>
        </div>
    </div>

    <!-- Game screen -->
    <div class="game-screen" id="gameScreen">
        <div class="game-header">
            <div class="student-badge" id="studentBadge">👤 Student</div>
            <div class="score-badge">🏆 Score <span id="scoreDisplay">0</span></div>
            <div class="action-buttons">
                <button class="restart-btn" id="restartBtn">⟲ Restart</button>
                <button class="submit-btn" id="submitBtn">✓ Submit</button>
            </div>
        </div>

        <div class="columns-container">
            <div class="column left-column" id="leftColumn">
                <div class="word-grid" id="leftGrid"></div>
            </div>
            <div class="column right-column" id="rightColumn">
                <div class="word-grid" id="rightGrid"></div>
            </div>
        </div>
        <div class="hint" id="hintMessage">Click a Swahili word on the left, then an English word on the right</div>
    </div>

    <script>
        (function() {
            // ---------- Data: Swahili & English translations ----------
            const PAIRS = [
                { swahili: "Maji",   english: "Water" },
                { swahili: "Moto",   english: "Fire" },
                { swahili: "Mbwa",   english: "Dog" },
                { swahili: "Nyota",  english: "Star" },
                { swahili: "Mvua",   english: "Rain" },
                { swahili: "Mti",    english: "Tree" },
                { swahili: "Jiwe",   english: "Stone" },
                { swahili: "Jua",    english: "Sun" },
                { swahili: "Wingu",  english: "Cloud" },
                { swahili: "Upepo",  english: "Wind" }
            ];

            const SWAHILI_WORDS = PAIRS.map(p => p.swahili);
            const ENGLISH_WORDS = PAIRS.map(p => p.english);

            const PAIR_COLORS = [
                { bg: '#FFE0B5', border: '#E6A756' },
                { bg: '#C9E4DE', border: '#5A9E8F' },
                { bg: '#F7D6E0', border: '#C97B8B' },
                { bg: '#D4E2D4', border: '#6F9E6F' },
                { bg: '#E6D7F0', border: '#9B7BB5' },
                { bg: '#FDE2D4', border: '#D68B6A' },
                { bg: '#D0E3F0', border: '#6C9EB8' },
                { bg: '#F0EAC8', border: '#B8A54A' },
                { bg: '#E3D7C9', border: '#A88C72' },
                { bg: '#D9E8D9', border: '#7FA87F' }
            ];

            // ---------- Global state ----------
            let currentStudentId = '';
            let leftItems = [];
            let rightItems = [];
            let selectedLeftItem = null;
            let pairColorMap = new Map();
            let nextPairId = 0;
            let groupCounter = 0;
            let isSubmitted = false;

            // DOM elements
            const startScreen = document.getElementById('startScreen');
            const gameScreen = document.getElementById('gameScreen');
            const studentIdInput = document.getElementById('studentIdInput');
            const startBtn = document.getElementById('startBtn');
            const studentBadge = document.getElementById('studentBadge');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const leftGrid = document.getElementById('leftGrid');
            const rightGrid = document.getElementById('rightGrid');
            const restartBtn = document.getElementById('restartBtn');
            const submitBtn = document.getElementById('submitBtn');
            const hintMessage = document.getElementById('hintMessage');

            // ---------- Utilities ----------
            function shuffleArray(arr) {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            // Sort by groupOrder (matched pairs first in order, unmatched last)
            function applyOrderToGrids() {
                const leftSorted = [...leftItems].sort((a, b) => {
                    const aOrder = a.pairId ? a.groupOrder : 9999;
                    const bOrder = b.pairId ? b.groupOrder : 9999;
                    if (aOrder !== bOrder) return aOrder - bOrder;
                    return leftItems.indexOf(a) - leftItems.indexOf(b);
                });
                leftSorted.forEach(item => leftGrid.appendChild(item.element));

                const rightSorted = [...rightItems].sort((a, b) => {
                    const aOrder = a.pairId ? a.groupOrder : 9999;
                    const bOrder = b.pairId ? b.groupOrder : 9999;
                    if (aOrder !== bOrder) return aOrder - bOrder;
                    return rightItems.indexOf(a) - rightItems.indexOf(b);
                });
                rightSorted.forEach(item => rightGrid.appendChild(item.element));
            }

            // Reset game
            function resetGame() {
                if (selectedLeftItem) {
                    selectedLeftItem.element.classList.remove('selected');
                    selectedLeftItem = null;
                }

                leftItems = [];
                rightItems = [];
                pairColorMap.clear();
                nextPairId = 0;
                groupCounter = 0;
                isSubmitted = false;
                scoreDisplay.textContent = '0';

                leftGrid.innerHTML = '';
                rightGrid.innerHTML = '';

                // Left side: Swahili words (fixed order)
                SWAHILI_WORDS.forEach((sw, idx) => {
                    const div = document.createElement('div');
                    div.className = 'word-item';
                    div.textContent = sw;
                    div.dataset.side = 'left';
                    const item = {
                        id: `left-${idx}-${Date.now()}-${Math.random()}`,
                        swahili: sw,
                        element: div,
                        pairId: null,
                        groupOrder: 9999,
                    };
                    leftItems.push(item);
                    leftGrid.appendChild(div);
                });

                // Right side: English words (shuffled)
                const shuffledEnglish = shuffleArray(ENGLISH_WORDS);
                shuffledEnglish.forEach((eng, idx) => {
                    const div = document.createElement('div');
                    div.className = 'word-item';
                    div.textContent = eng;
                    div.dataset.side = 'right';
                    const item = {
                        id: `right-${idx}-${Date.now()}-${Math.random()}`,
                        english: eng,
                        element: div,
                        pairId: null,
                        groupOrder: 9999,
                    };
                    rightItems.push(item);
                    rightGrid.appendChild(div);
                });

                // Clear styles
                document.querySelectorAll('.word-item').forEach(el => {
                    el.style.backgroundColor = '';
                    el.style.borderColor = '';
                    el.classList.remove('matched-pair', 'correct-submit', 'wrong-submit', 'selected');
                });

                applyOrderToGrids();
                selectedLeftItem = null;
            }

            // Event delegation
            let eventDelegationInitialized = false;

            function initEventDelegation() {
                if (eventDelegationInitialized) return;
                eventDelegationInitialized = true;

                leftGrid.addEventListener('click', (e) => {
                    const wordDiv = e.target.closest('.word-item');
                    if (!wordDiv || isSubmitted) return;
                    const leftItem = leftItems.find(item => item.element === wordDiv);
                    if (!leftItem) return;

                    if (selectedLeftItem) {
                        selectedLeftItem.element.classList.remove('selected');
                    }
                    selectedLeftItem = leftItem;
                    wordDiv.classList.add('selected');
                });

                rightGrid.addEventListener('click', (e) => {
                    const wordDiv = e.target.closest('.word-item');
                    if (!wordDiv || isSubmitted) return;
                    if (!selectedLeftItem) {
                        hintMessage.textContent = 'Please select a Swahili word on the left first';
                        return;
                    }

                    const rightItem = rightItems.find(item => item.element === wordDiv);
                    if (!rightItem) return;

                    // Remove previous pairing of the selected left item
                    if (selectedLeftItem.pairId !== null) {
                        const oldPairId = selectedLeftItem.pairId;
                        selectedLeftItem.pairId = null;
                        selectedLeftItem.groupOrder = 9999;
                        selectedLeftItem.element.style.backgroundColor = '';
                        selectedLeftItem.element.style.borderColor = '';
                        selectedLeftItem.element.classList.remove('matched-pair');

                        const oldRight = rightItems.find(r => r.pairId === oldPairId);
                        if (oldRight) {
                            oldRight.pairId = null;
                            oldRight.groupOrder = 9999;
                            oldRight.element.style.backgroundColor = '';
                            oldRight.element.style.borderColor = '';
                            oldRight.element.classList.remove('matched-pair');
                        }
                        pairColorMap.delete(oldPairId);
                    }

                    // Remove previous pairing of the clicked right item
                    if (rightItem.pairId !== null) {
                        const oldPairId = rightItem.pairId;
                        const oldLeft = leftItems.find(l => l.pairId === oldPairId);
                        if (oldLeft) {
                            oldLeft.pairId = null;
                            oldLeft.groupOrder = 9999;
                            oldLeft.element.style.backgroundColor = '';
                            oldLeft.element.style.borderColor = '';
                            oldLeft.element.classList.remove('matched-pair');
                        }
                        rightItem.pairId = null;
                        rightItem.groupOrder = 9999;
                        rightItem.element.style.backgroundColor = '';
                        rightItem.element.style.borderColor = '';
                        rightItem.element.classList.remove('matched-pair');
                        pairColorMap.delete(oldPairId);
                    }

                    // Create new pairing
                    const newPairId = `pair-${nextPairId++}`;
                    const colorIndex = pairColorMap.size % PAIR_COLORS.length;
                    const color = PAIR_COLORS[colorIndex];
                    pairColorMap.set(newPairId, colorIndex);

                    groupCounter += 1;
                    const newOrder = groupCounter;

                    // Apply to left item
                    selectedLeftItem.pairId = newPairId;
                    selectedLeftItem.groupOrder = newOrder;
                    selectedLeftItem.element.style.backgroundColor = color.bg;
                    selectedLeftItem.element.style.borderColor = color.border;
                    selectedLeftItem.element.classList.add('matched-pair');

                    // Apply to right item
                    rightItem.pairId = newPairId;
                    rightItem.groupOrder = newOrder;
                    rightItem.element.style.backgroundColor = color.bg;
                    rightItem.element.style.borderColor = color.border;
                    rightItem.element.classList.add('matched-pair');

                    // Clear selection
                    selectedLeftItem.element.classList.remove('selected');
                    selectedLeftItem = null;

                    // Reorder
                    applyOrderToGrids();
                    hintMessage.textContent = 'Pair matched! Continue or change your answers.';
                });
            }

            function calculateScore() {
                let correctCount = 0;
                leftItems.forEach(left => {
                    if (left.pairId) {
                        const right = rightItems.find(r => r.pairId === left.pairId);
                        if (right) {
                            const pair = PAIRS.find(p => p.swahili === left.swahili);
                            if (pair && pair.english === right.english) {
                                correctCount++;
                            }
                        }
                    }
                });
                return correctCount;
            }

            function handleSubmit() {
                if (isSubmitted) return;
                isSubmitted = true;

                if (selectedLeftItem) {
                    selectedLeftItem.element.classList.remove('selected');
                    selectedLeftItem = null;
                }

                const score = calculateScore();
                scoreDisplay.textContent = score;

                document.querySelectorAll('.word-item').forEach(el => {
                    el.classList.remove('correct-submit', 'wrong-submit');
                });

                leftItems.forEach(left => {
                    const leftEl = left.element;
                    if (left.pairId) {
                        const right = rightItems.find(r => r.pairId === left.pairId);
                        if (right) {
                            const pair = PAIRS.find(p => p.swahili === left.swahili);
                            const isCorrect = pair && pair.english === right.english;
                            if (isCorrect) {
                                leftEl.classList.add('correct-submit');
                                right.element.classList.add('correct-submit');
                            } else {
                                leftEl.classList.add('wrong-submit');
                                right.element.classList.add('wrong-submit');
                            }
                        } else {
                            leftEl.classList.add('wrong-submit');
                        }
                    } else {
                        leftEl.classList.add('wrong-submit');
                    }
                });

                rightItems.forEach(right => {
                    if (!right.pairId) {
                        right.element.classList.add('wrong-submit');
                    }
                });

                hintMessage.textContent = `Submitted! Score: ${score} / 10`;
            }

            function handleRestart() {
                isSubmitted = false;
                if (selectedLeftItem) {
                    selectedLeftItem.element.classList.remove('selected');
                    selectedLeftItem = null;
                }
                resetGame();
                hintMessage.textContent = 'Click a Swahili word on the left, then an English word on the right';
                scoreDisplay.textContent = '0';
                document.querySelectorAll('.word-item').forEach(el => {
                    el.classList.remove('correct-submit', 'wrong-submit');
                });
            }

            function startGame(studentId) {
                currentStudentId = studentId;
                studentBadge.textContent = `👤 ${studentId}`;
                startScreen.style.display = 'none';
                gameScreen.style.display = 'block';

                initEventDelegation();

                resetGame();
                hintMessage.textContent = 'Click a Swahili word on the left, then an English word on the right';
                scoreDisplay.textContent = '0';
                document.querySelectorAll('.word-item').forEach(el => {
                    el.classList.remove('correct-submit', 'wrong-submit');
                });
            }

            // ---------- Listeners ----------
            studentIdInput.addEventListener('input', (e) => {
                startBtn.disabled = e.target.value.trim() === '';
            });

            startBtn.addEventListener('click', () => {
                const sid = studentIdInput.value.trim();
                if (sid) startGame(sid);
            });

            studentIdInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && studentIdInput.value.trim()) {
                    startGame(studentIdInput.value.trim());
                }
            });

            restartBtn.addEventListener('click', handleRestart);
            submitBtn.addEventListener('click', handleSubmit);

        })();
    </script>
</body>
</html>
